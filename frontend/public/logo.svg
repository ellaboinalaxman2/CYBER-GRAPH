<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield/Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#0f172a" stroke="url(#cyber-grad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Graph Nodes -->
  <circle cx="50" cy="30" r="7" fill="#06b6d4" />
  <circle cx="28" cy="65" r="6" fill="#3b82f6" />
  <circle cx="72" cy="65" r="6" fill="#ef4444" />
  <circle cx="50" cy="52" r="8" fill="#10b981" />
  
  <!-- Graph Connections -->
  <line x1="50" y1="30" x2="50" y2="52" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="28" y2="65" stroke="#3b82f6" stroke-width="2.5" />
  <line x1="50" y1="52" x2="72" y2="65" stroke="#ef4444" stroke-width="2.5" />
  <line x1="28" y1="65" x2="72" y2="65" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
